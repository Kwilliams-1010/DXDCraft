plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.73'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        // Visual check: joins the local dev server and screenshots every gear form (see client/RenderTest).
        renderTest {
            client()
            gameDirectory = project.file('run-client')
            systemProperty 'dxdcraft.renderTest', 'true'
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565', '--username', 'GearTester'
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The mod version shown in-game comes from gradle.properties.
processResources {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: mod_version
    }
}
